plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.esmalagutti'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// Compact object headers (JEP 519, Java 25): 8-byte object headers instead of 12, so less heap
// for the same objects. A product feature in 25 but not on by default, so we turn it on here.
def jvmFlags = [
	'-XX:+UseCompactObjectHeaders'
]

repositories {
	mavenCentral()
}

ext {
	set('springModulithVersion', "2.1.1")
	set('mapstructVersion', "1.6.3")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.modulith:spring-modulith-observability-api'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
	runtimeOnly 'org.springframework.modulith:spring-modulith-observability-core'
	runtimeOnly 'org.springframework.modulith:spring-modulith-runtime'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	// Lets MapStruct see Lombok-generated getters, builders and constructors.
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

// Code style rules live in style/ (see style/README.md).
apply from: 'style/spotless.gradle'

// MapStruct defaults for every mapper (docs/adr/0002-mapstruct-for-mapping.md):
// mappers are Spring beans, and a target field nobody maps fails the build.
tasks.named('compileJava') {
	options.compilerArgs += [
		'-Amapstruct.defaultComponentModel=spring',
		'-Amapstruct.unmappedTargetPolicy=ERROR',
	]
}

// Tests are split by kind (docs/architecture/testing-strategy.md):
//   unit        no tag: plain JUnit, no Spring context, no Docker
//   module      @ModuleTest: one Spring Modulith module with Testcontainers PostgreSQL
//   integration @IntegrationTest: the whole application with Testcontainers PostgreSQL
// `test` (and so `build`/`check`) runs all three; CI runs them as separate steps.
tasks.withType(Test).configureEach {
	useJUnitPlatform()
	jvmArgs jvmFlags
}

def registerTestTask = { String name, String text, Closure tags ->
	tasks.register(name, Test) {
		description = text
		group = 'verification'
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		useJUnitPlatform(tags)
		// A kind with no tests yet (e.g. no module tests before Phase 1) must not fail the build.
		failOnNoDiscoveredTests = false
	}
}

registerTestTask('unitTest', 'Runs unit tests (no Spring context, no Docker).') {
	excludeTags 'module', 'integration'
}
registerTestTask('moduleTest', 'Runs Spring Modulith module tests (needs Docker).') {
	includeTags 'module'
}
registerTestTask('integrationTest', 'Runs full-application integration tests (needs Docker).') {
	includeTags 'integration'
}

tasks.named('moduleTest') { shouldRunAfter 'unitTest' }
tasks.named('integrationTest') { shouldRunAfter 'moduleTest' }

tasks.named('bootRun') {
	jvmArgs jvmFlags
}

tasks.named('bootTestRun') {
	jvmArgs jvmFlags
}
