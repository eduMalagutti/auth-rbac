services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: authrbac
      POSTGRES_USER: authrbac
      POSTGRES_PASSWORD: authrbac
    ports:
      - "5432"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025"      # SMTP

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
